<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraud Word Hunt</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f1fb;--ink:#0b2a5b;--card:#ffffff;--muted:#4a658f;--line:#c9dcf4;--lock:#d5e3f6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--ink:#e6efff;--card:#13264a;--muted:#a3badf;--line:#27406d;--lock:#1b3059}}
:root[data-theme="dark"]{--bg:#0b1630;--ink:#e6efff;--card:#13264a;--muted:#a3badf;--line:#27406d;--lock:#1b3059}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;min-height:100%}
.wrap{max-width:400px;margin:0 auto;padding:14px 14px 28px}
@media (min-width:860px){.wrap{max-width:900px}.layout{display:grid;grid-template-columns:400px 1fr;gap:26px;align-items:start}}
.machine{background:linear-gradient(#3a85f4,#1a52c4);border:4px solid #0f3a94;border-radius:32px 32px 16px 16px;padding:12px 12px 14px;box-shadow:0 10px 0 #0f3a94,0 18px 28px rgba(5,25,70,.35)}
h1{margin:2px 0 10px;text-align:center;font-weight:700;font-size:clamp(26px,8.4vw,34px);line-height:1;letter-spacing:.5px;
text-shadow:-2px -2px 0 #0f3a94,2px -2px 0 #0f3a94,-2px 2px 0 #0f3a94,2px 2px 0 #0f3a94,0 4px 0 #0f3a94}
h1 .f{color:#fff;display:block}
h1 .y{color:#ffd23f;display:block;font-size:.92em}
.glass{position:relative;border-radius:16px;overflow:hidden;border:3px solid #0f3a94;background:#dcecff}
canvas{display:block;width:100%;height:auto;aspect-ratio:340/400}
.over{position:absolute;inset:0;background:rgba(8,30,80,.82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.over[hidden]{display:none}
.over h2{margin:0;font-size:28px;color:#ffd23f}
.over p{margin:0;font-size:16px;line-height:1.35;max-width:26ch}
.panel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:0 6px}
.pad{display:flex;gap:10px}
button{font-family:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.round{width:58px;height:58px;border-radius:50%;border:3px solid #0f3a94;background:radial-gradient(circle at 35% 30%,#7db1ff,#1f63e0 70%);color:#fff;font-size:22px;font-weight:700;box-shadow:0 5px 0 #0f3a94}
.grab{width:86px;height:86px;border-radius:50%;border:3px solid #b98500;background:radial-gradient(circle at 35% 30%,#fff0a8,#ffc928 70%);color:#6a4a00;font-size:17px;font-weight:700;box-shadow:0 6px 0 #b98500}
.round:active,.round.on,.grab:active{transform:translateY(4px);box-shadow:0 1px 0 #0f3a94}
.grab:active{box-shadow:0 1px 0 #b98500}
.grab:disabled{opacity:.55}
.chute{margin-top:14px;background:#0c2a6e;border:3px solid #0f3a94;border-radius:12px 12px 8px 8px;color:#ffd23f;text-align:center;font-weight:700;font-size:16px;padding:12px 8px;min-height:50px;box-shadow:inset 0 4px 10px rgba(0,0,0,.45)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.logo{height:56px;width:auto;display:block;background:#fff;border:3px solid #0f3a94;border-radius:12px;padding:6px 10px}
.tag{margin:0;text-align:right;font-size:12px;line-height:1.3;color:#cfe1ff;font-weight:500;max-width:11ch}
.notes{margin-top:22px;background:#071634;border:2px solid #39e1ff;border-radius:20px;padding:16px;color:#fff;
box-shadow:0 0 6px #39e1ff,0 0 22px rgba(57,225,255,.55),inset 0 0 16px rgba(57,225,255,.22)}
.notes h2{margin:0;font-size:21px;text-shadow:0 0 10px #39e1ff;display:flex;justify-content:space-between;gap:10px}
.notes h2 span{color:#ffd23f;text-shadow:0 0 10px #ffc928}
.sub{margin:4px 0 14px;font-size:13px;color:#9fd8ff}
.list{display:grid;gap:12px;padding:4px}
.empty{margin:0;padding:22px 12px;text-align:center;color:#9fd8ff;border:2px dashed rgba(57,225,255,.4);border-radius:14px;font-size:14px}
.note{position:relative;padding:11px 13px 12px;border-radius:14px;border:2px solid #39e1ff;background:rgba(57,225,255,.07);
box-shadow:0 0 5px #39e1ff,0 0 14px rgba(57,225,255,.45),inset 0 0 10px rgba(57,225,255,.15)}
.note h3{margin:0 0 3px;font-size:17px;text-shadow:0 0 8px rgba(57,225,255,.8)}
.note p{margin:0;font-size:13.5px;line-height:1.4;color:#d8ecff}
.note .t{margin-top:6px;color:#fff}.note .t b{color:#ffd23f}
.note.new{border-color:#ffd23f;background:rgba(255,210,63,.08);animation:glow 1.4s ease-in-out 3;
box-shadow:0 0 6px #ffd23f,0 0 20px rgba(255,201,40,.6),inset 0 0 12px rgba(255,201,40,.2)}
.note.new h3{text-shadow:0 0 8px rgba(255,210,63,.9)}
.badge{position:absolute;top:-10px;right:12px;background:#ffd23f;color:#5a3d00;font-style:normal;font-weight:700;font-size:11px;padding:2px 9px;border-radius:999px;box-shadow:0 0 12px #ffc928}
@keyframes glow{50%{box-shadow:0 0 10px #ffd23f,0 0 34px rgba(255,201,40,.9),inset 0 0 18px rgba(255,201,40,.35)}}
@media (prefers-reduced-motion:reduce){.note.new{animation:none}}
@media (min-width:860px){.notes{margin-top:0;position:sticky;top:14px}.list{max-height:540px;overflow:auto}}
.hud{display:flex;justify-content:space-between;margin:18px 4px 10px;font-size:17px;font-weight:500}
.hud b{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.c{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 11px;min-height:64px}
.c b{display:block;font-size:15px}
.c span{display:block;font-size:12.5px;line-height:1.3;color:var(--muted);margin-top:2px}
.c.lock{background:var(--lock);border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.c.new{animation:pop .5s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.c.new{animation:none}}
.again{font-family:inherit;font-size:16px;font-weight:700;padding:10px 22px;border-radius:999px;border:3px solid #b98500;background:#ffc928;color:#5a3d00}
</style>
</head>

  if(!got.size){g.innerHTML='<p class="empty">Capit boneka pertamamu. Catatannya langsung muncul di sini.</p>';return}
  [...got].reverse().forEach(k=>{
    const w=WORDS.find(x=>x[0]===k),d=document.createElement('div');
    d.className='note'+(k===lastNew?' new':'');
    d.innerHTML=(k===lastNew?'<i class="badge">Baru!</i>':'')+'<h3></h3><p class="m"></p><p class="t"><b>Ingat:</b> <span></span></p>';
    d.querySelector('h3').textContent=k;d.querySelector('.m').textContent=w[1];d.querySelector('.t span').textContent=TIPS[k];
    g.appendChild(d)});
}

function startDrop(){if(A.st!=='idle'||left<=0)return;left--;A.st='drop';hud()}
function grab(){
  let best=null,bd=1e9;
  for(const it of items)if(it.st==='pile'){const dx=Math.abs(it.x-A.x),sc=dx+it.y*.04;if(dx<36&&sc<bd){bd=sc;best=it}}
  if(!best){say('Meleset…');return}
  const dx=Math.abs(best.x-A.x);
  if(Math.random()<.95-dx/60){A.it=best;best.st='held';A.slip=Math.random()<.2;A.slipY=70+Math.random()*120}
  else say('Hampir! Coba lagi')
}
function carry(){if(A.it){A.it.x=A.x;A.it.y=A.y+44;A.it.rot=Math.sin(Date.now()/150)*.08}}
function check(){
  hud();
  const o=document.getElementById('over');
  if(got.size===WORDS.length){ot.textContent='Selamat!';om.textContent='Semua kata berhasil kamu capit. Tetap jujur, tetap aman.';o.hidden=false}
  else if(left<=0){ot.textContent='Percobaan habis';om.textContent='Kamu mengumpulkan '+got.size+' dari '+WORDS.length+' kata. Coba lagi?';o.hidden=false}
}
function step(){
  const a=A;
  if(a.st==='idle'){a.x=Math.max(CHX,Math.min(306,a.x+(keys.r-keys.l)*2.8))}
  else if(a.st==='drop'){a.y+=3.2;if(a.y>=MAXY){a.y=MAXY;a.st='close'}}
  else if(a.st==='close'){a.open=Math.max(.1,a.open-.025);if(a.open<=.1){grab();a.st='rise'}}
  else if(a.st==='rise'){a.y-=2.4;carry();
    if(a.it&&a.slip&&a.y<a.slipY){a.it.st='fall';a.it.vy=0;a.it=null;say('Yah, lepas!')}
    if(a.y<=34){a.y=34;a.st='back'}}
  else if(a.st==='back'){carry();const d=CHX-a.x;if(Math.abs(d)<2.4){a.x=CHX;a.st='open'}else a.x+=Math.sign(d)*2.4}
  else if(a.st==='open'){
    if(a.it&&a.open>.3){a.it.st='fall';a.it.chute=true;a.it.vy=0;a.it=null}
    a.open+=.03;if(a.open>=.55){a.open=.55;a.st='wait';a.t=60}}
  else if(a.st==='wait'){if(--a.t<=0){a.st='idle';check()}}
  for(const it of items){
    if(it.st!=='fall')continue;
    it.vy+=.55;it.y+=it.vy;
    if(it.chute){if(it.y>H+40){it.st='gone';got.add(it.w);lastNew=it.w;say('Dapat: '+it.w+'!');render();hud()}}
    else if(it.y>=it.by){it.y=it.by;it.vy=0;it.st='pile'}
  }
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawItem(it){
  const w=64,r=30;
  ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
  ctx.fillStyle=it.c;ctx.strokeStyle='rgba(10,30,80,.4)';ctx.lineWidth=2;
  const s=it.s;
  if(s==='bear'||s==='cat'){
    ctx.beginPath();
    if(s==='bear'){ctx.arc(-21,-23,9,0,7);ctx.moveTo(30,-23);ctx.arc(21,-23,9,0,7)}
    else{ctx.moveTo(-26,-14);ctx.lineTo(-22,-36);ctx.lineTo(-6,-24);ctx.moveTo(26,-14);ctx.lineTo(22,-36);ctx.lineTo(6,-24)}
    ctx.fill();ctx.stroke();
  }
  if(s==='sprout'){ctx.fillStyle='#5fbf6a';ctx.beginPath();ctx.ellipse(-7,-31,6,11,-.5,0,7);ctx.ellipse(7,-31,6,11,.5,0,7);ctx.fill();ctx.fillStyle=it.c}
  ctx.beginPath();
  if(s==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.64:r*1.04;ctx[i?'lineTo':'moveTo'](Math.cos(a)*q,Math.sin(a)*q+2)}ctx.closePath()}
  else if(s==='book'||s==='gift'){ctx.roundRect(-27,-28,54,56,10)}
  else if(s==='cloud'){ctx.arc(-14,0,17,0,7);ctx.moveTo(30,0);ctx.arc(14,0,17,0,7);ctx.moveTo(14,-10);ctx.arc(0,-10,16,0,7);ctx.moveTo(25,6);ctx.arc(0,6,25,0,7)}
  else if(s==='sprout'){ctx.ellipse(0,2,28,28,0,0,7)}
  else{ctx.arc(0,0,r,0,7)}
  ctx.fill();if(s!=='cloud')ctx.stroke();
  if(s==='penguin'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,6,19,22,0,0,7);ctx.fill()}
  if(s==='gift'){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-28);ctx.lineTo(0,28);ctx.moveTo(-27,-6);ctx.lineTo(27,-6);ctx.stroke()}
  if(s==='book'){ctx.fillStyle='rgba(255,255,255,.35)';rr(-27,-28,7,56,3);ctx.fill()}
  // face
  const fy=s==='star'?-8:-12;
  ctx.fillStyle='#0b2a5b';ctx.beginPath();ctx.arc(-9,fy,2.6,0,7);ctx.moveTo(11.6,fy);ctx.arc(9,fy,2.6,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,120,150,.45)';ctx.beginPath();ctx.arc(-16,fy+5,3.6,0,7);ctx.moveTo(19.6,fy+5);ctx.arc(16,fy+5,3.6,0,7);ctx.fill();
  ctx.strokeStyle='#0b2a5b';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,fy+3,3.8,.15,Math.PI-.15);ctx.stroke();
  // label
  const lw=w-2,lh=17;
  ctx.fillStyle='#fff';ctx.strokeStyle='rgba(10,30,80,.3)';ctx.lineWidth=1.5;rr(-lw/2,8,lw,lh,6);ctx.fill();ctx.stroke();
  let fs=10.5;ctx.font='700 '+fs+'px '+FONT;
  while(ctx.measureText(it.w).width>lw-6&&fs>6){fs-=.5;ctx.font='700 '+fs+'px '+FONT}
  ctx.fillStyle='#0b2a5b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.w,0,8+lh/2+.5);
  ctx.restore();
}
function drawClaw(){
  const a=A;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.fillStyle='#9fb4d6';rr(6,8,W-12,8,4);ctx.fill();
  ctx.fillStyle='#6f87b3';rr(a.x-16,6,32,12,5);ctx.fill();
  ctx.strokeStyle='#5a6f96';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,16);ctx.lineTo(a.x,a.y-8);ctx.stroke();
  ctx.fillStyle='#e3ebf7';ctx.strokeStyle='#5a6f96';ctx.lineWidth=2;rr(a.x-14,a.y-9,28,17,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1f63e0';ctx.beginPath();ctx.arc(a.x,a.y,3.5,0,7);ctx.fill();
  for(const sd of[-1,1]){
    const px=a.x+sd*10,py=a.y+6,o=a.open;
    const mx=px+sd*Math.sin(o)*26,my=py+Math.cos(o)*26;
    const tx=mx-sd*Math.sin(o*.9)*15,ty=my+Math.cos(o*.9)*15;
    for(const[wd,col]of[[8,'#5a6f96'],[5,'#e3ebf7']]){
      ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(mx,my);ctx.lineTo(tx,ty);ctx.stroke()}
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#eef6ff');g.addColorStop(1,'#c5dcf7');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(220,0);ctx.lineTo(262,0);ctx.lineTo(150,H);ctx.lineTo(108,H);ctx.fill();
  // chute
  ctx.fillStyle='#0c2a6e';rr(-6,306,70,H-300,10);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.font='700 11px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PRIZE',31,326);ctx.fillText('▼',31,344);
  for(const b of balls)if(b.y<372)ball(b);
  items.filter(i=>i.st!=='gone').sort((a,b)=>(a.st==='held'||a.st==='fall')-(b.st==='held'||b.st==='fall')||a.y-b.y).forEach(drawItem);
  for(const b of balls)if(b.y>=372)ball(b);
  drawClaw();
}
function ball(b){
  ctx.fillStyle=b.c;ctx.strokeStyle='rgba(10,30,80,.25)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(b.x-b.r*.3,b.y-b.r*.35,b.r*.22,0,7);ctx.fill();
}
function loop(){step();draw();requestAnimationFrame(loop)}

// controls
function hold(id,k){const b=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=1;b.classList.add('on')},off=()=>{keys[k]=0;b.classList.remove('on')};
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,off))}
hold('bl','l');hold('br','r');
document.getElementById('go').addEventListener('click',startDrop);
document.getElementById('again').addEventListener('click',reset);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keys.l=1;else if(e.key==='ArrowRight')keys.r=1;
  else if(e.key===' '||e.key==='Enter'){if(document.activeElement.tagName!=='BUTTON'){e.preventDefault();startDrop()}}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});
reset();loop();
</script>
